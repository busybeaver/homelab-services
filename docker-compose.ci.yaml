services:
  adguard-home:
    networks:
      dockervlan:
        ipv4_address: 172.20.0.130
    mac_address: ""

  uptime-kuma:
    environment:
      UPTIME_KUMA_HOST: 0.0.0.0
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    networks:
      dockervlan:
        ipv4_address: 172.20.0.132
    mac_address: ""

  node-red:
    networks:
      dockervlan:
        ipv4_address: 172.20.0.131
    mac_address: ""

  test:
    image: curlimages/curl:latest
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    networks:
      dockervlan:
        ipv4_address: 172.20.0.133
    depends_on:
      adguard-home:
        condition: service_started
      uptime-kuma:
        condition: service_started
      node-red:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        set -e
        test_service() {
          local name=$$1
          local host=$$2
          local port=$$3
          local pattern=$$4
          echo "Testing $${name}..."

          local max_retries=20
          local retry_delay=5
          local success=false

          for i in $$(seq 1 $$max_retries); do
            echo "Attempt $$i/$$max_retries for $${name}..."
            # Try HTTPS then HTTP
            for proto in https http; do
              local url="$${proto}://$${host}:$${port}/"
              echo "  Trying $${url}..."
              if response=$$(curl -k -s -f -L --connect-timeout 5 "$${url}"); then
                if echo "$${response}" | grep -qi "$${pattern}"; then
                  echo "  $${name} test passed via $${proto}!"
                  success=true
                  break 2
                else
                  echo "  $${name} connected via $${proto}, but pattern '$${pattern}' not found."
                  echo "  Response snippet: $$(echo "$${response}" | head -c 500)"
                fi
              else
                echo "  $${name} could not be reached via $${proto}."
              fi
            done
            [ "$$i" -lt "$$max_retries" ] && sleep $$retry_delay
          done

          if [ "$$success" = false ]; then
            echo "$${name} test failed after $$max_retries attempts."
            exit 1
          fi
        }
        test_service "adguard-home" "adguard-home" "443" "AdGuard Home"
        test_service "uptime-kuma" "uptime-kuma" "443" "Uptime Kuma"
        test_service "node-red" "node-red" "443" "Node-RED"
        echo "All tests passed!"

networks:
  dockervlan:
    driver: bridge
    driver_opts:
      parent: ""
    ipam:
      config:
        - subnet: 172.20.0.0/24
