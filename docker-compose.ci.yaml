services:
  adguard-home:
    networks:
      dockervlan:
        ipv4_address: 10.200.0.130
    mac_address: ""

  # uptime-kuma:
  #   environment:
  #     UPTIME_KUMA_HOST: 10.200.0.132
  #     NODE_TLS_REJECT_UNAUTHORIZED: "0"
  #   networks:
  #     dockervlan:
  #       ipv4_address: 10.200.0.132
  #   mac_address: ""

  beszel-hub:
    networks:
      dockervlan:
        ipv4_address: 10.200.0.134
    mac_address: ""

  node-red:
    networks:
      dockervlan:
        ipv4_address: 10.200.0.131
    mac_address: ""

  open-webui:
    networks:
      dockervlan:
        ipv4_address: 10.200.0.135
    mac_address: ""

  adguard-home-ts:
    entrypoint: ["tailscaled", "--tun=userspace-networking"]
    devices: []

  # uptime-kuma-ts:
  #   entrypoint: ["tailscaled", "--tun=userspace-networking"]
  #   devices: []

  beszel-hub-ts:
    entrypoint: ["tailscaled", "--tun=userspace-networking"]
    devices: []

  node-red-ts:
    entrypoint: ["tailscaled", "--tun=userspace-networking"]
    devices: []

  open-webui-ts:
    entrypoint: ["tailscaled", "--tun=userspace-networking"]
    devices: []

  test:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    networks:
      dockervlan:
        ipv4_address: 10.200.0.133
    depends_on:
      adguard-home:
        condition: service_healthy
      beszel-hub:
        condition: service_healthy
      node-red:
        condition: service_healthy
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      open-webui:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        test_service() {
          local name=$$1
          local url=$$2
          local pattern=$$3
          echo "Testing $${name} at $${url}..."
          response=$$(curl -L --retry 5 --retry-delay 5 --retry-connrefused -k -s -f "$${url}")
          if [ $$? -eq 0 ]; then
            if echo "$${response}" | grep -i -q "$${pattern}"; then
              echo "$${name} test passed!"
            else
              echo "$${name} test failed: response did not match pattern '$${pattern}'"
              printf "Response body preview:\n%.500s\n" "$${response}"
              return 1
            fi
          else
            echo "$${name} test failed: could not reach $${url}"
            return 1
          fi
        }
        test_service "adguard-home" "https://adguard-home:443/" "apple-touch-icon"
        test_service "beszel-hub" "http://beszel-hub:8090/" "beszel"
        test_service "node-red" "https://node-red:443/" "Node-RED"
        test_service "open-webui" "http://open-webui:8080/" "webui"
        echo "All tests passed!"

networks:
  dockervlan:
    driver: bridge
    driver_opts:
      parent: ""
    ipam:
      config:
        - subnet: 10.200.0.0/24
