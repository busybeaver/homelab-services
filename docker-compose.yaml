  adguard-home:
    container_name: adguard-home
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    networks:
      dockervlan:
        ipv4_address: "${DOCKER_VLAN_IP_PREFIX:?DOCKER_VLAN_IP_PREFIX is required}.130"
      adguard-home_internal:
        aliases:
          - "${ADGUARD_DOMAIN:?ADGUARD_DOMAIN is required}"
    mac_address: "${ADGUARD_MAC_ADDRESS:?ADGUARD_MAC_ADDRESS is required}"
    dns: "${DNS_IP:?DNS_IP is required}"
    user: "${ADGUARD_USER:?ADGUARD_USER is required}:${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    <<: *hardened-security
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=770,uid=${ADGUARD_USER:?ADGUARD_USER is required},gid=${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    volumes:
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/adguard/conf:/opt/adguardhome/conf:rw
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/adguard/work:/opt/adguardhome/work:rw
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/adguard/cert:/opt/adguardhome/cert:ro
    environment:
      TZ: "${TIMEZONE:?TIMEZONE is required}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -qO- --no-check-certificate https://127.0.0.1:443/ || wget --no-verbose --tries=1 -qO- --no-check-certificate http://127.0.0.1:443/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    pids_limit: 200
    mem_limit: 256m

  adguard-home-ts:
    container_name: adguard-home-ts
    <<: *tailscale-sidecar
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_ADGUARD_HOME:?TS_AUTHKEY_ADGUARD_HOME is required}
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:type-docker,tag:hosting-onpremise,tag:svc-adguard
      TS_HOSTNAME: adguard-home
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"

    volumes:
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/tailscale/adguard:/var/lib/tailscale:rw

    networks:
      - adguard-home_internal
      - ts_egress

