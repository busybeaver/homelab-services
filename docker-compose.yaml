networks:
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: ovs_bond0
    ipam:
      config:
        - subnet: "${DOCKER_VLAN_IP_PREFIX:?DOCKER_VLAN_IP_PREFIX is required}.0/24"
          ip_range: "${DOCKER_VLAN_IP_PREFIX:?DOCKER_VLAN_IP_PREFIX is required}.128/25"
          gateway: "${DNS_IP:?DNS_IP is required}"
  adguard-home_internal:
    driver: bridge
    internal: true
  # uptime-kuma_internal:
  #   driver: bridge
  #   internal: true
  beszel-hub_internal:
    driver: bridge
    internal: true
  node-red_internal:
    driver: bridge
    internal: true
  open-webui_internal:
    driver: bridge
    internal: true
  postgres_internal:
    driver: bridge
    internal: true
  ai_network:
    driver: bridge
  ts_egress:
    driver: bridge
