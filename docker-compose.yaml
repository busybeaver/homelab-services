x-tailscale-sidecar: &tailscale-sidecar
  image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_drop:
    - ALL
  cap_add:
    - NET_ADMIN
    - NET_RAW
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  # not supported by Synology NAS:
  # cpus: 0.25
  mem_limit: 128m
  mem_reservation: 64m
  pids_limit: 100
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  # the tailscale image doesn't define a HEALTHCHECK. containerboot serves /healthz (see TS_ENABLE_HEALTH_CHECK in each sidecar) which returns 200 only once the node has a tailnet IP
  healthcheck:
    test:
      ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:9002/healthz"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

x-hardened-security: &hardened-security
  cap_drop:
    - ALL
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  # important: keep this comment for the future, even though the NAS doesn't support this one yet (so we need to keep "cap_add: NET_BIND_SERVICE" for now in addition)
  # sysctls:
  #   - net.ipv4.ip_unprivileged_port_start=443
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

