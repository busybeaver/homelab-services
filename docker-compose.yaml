  beszel-hub:
    container_name: beszel-hub
    image: henrygd/beszel:v0.20.0@sha256:897e807a065adf8e89e30ae0cd79d1f5e38fe84ccaffbc418bde9d3cdca4eacc
    restart: unless-stopped
    networks:
      dockervlan:
        ipv4_address: "${DOCKER_VLAN_IP_PREFIX}.134"
      beszel-hub_internal:
        aliases:
          - "${BESZEL_DOMAIN}"
    mac_address: "${BESZEL_MAC_ADDRESS}"
    dns: "${DNS_IP}"
    user: "${BESZEL_USER}:${DOCKER_USER_GROUP}"
    <<: *hardened-security
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=660,uid=${BESZEL_USER},gid=${DOCKER_USER_GROUP}"
    volumes:
      - "${VOLUME_BASE_DIRECTORY}/beszel/data:/beszel_data:rw"
      - "${VOLUME_BASE_DIRECTORY}/beszel/socket:/beszel_socket:rw"
    environment:
      APP_URL: "http://${DOCKER_VLAN_IP_PREFIX}.134:8090"
      CHECK_UPDATES: "false"

      # Do NOT set AUTO_LOGIN.
      # Do NOT set TRUSTED_AUTH_HEADER unless you deliberately deploy
      # a trusted SSO/auth proxy and also configure TRUSTED_PROXY_IPS.
      # Do NOT set SHARE_ALL_SYSTEMS in a multi-user setup.

      # Optional external dead-man's-switch check:
      # HEARTBEAT_URL: "https://hc-ping.example.net/<unique-secret-url>"
      # HEARTBEAT_METHOD: "POST"
      # HEARTBEAT_INTERVAL: "60"
    pids_limit: 150
    mem_limit: 384m
    # not supported by Synology NAS:
    # cpus: 1.0
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3

  beszel-hub-ts:
    container_name: beszel-hub-ts
    <<: *tailscale-sidecar
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_BESZEL}
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:type-docker,tag:hosting-onpremise,tag:svc-beszel
      TS_HOSTNAME: beszel
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"

    volumes:
      - ${VOLUME_BASE_DIRECTORY}/tailscale/beszel:/var/lib/tailscale:rw

    networks:
      - beszel-hub_internal
      - ts_egress

  node-red:
    container_name: node-red
    image: ghcr.io/busybeaver/homelab-packages/node-red:latest@sha256:59308e589dbac32b61dce43d0c9a2167c05361c31e6e1e6d21acd4679ea781ef
    networks:
      dockervlan:
        ipv4_address: "${DOCKER_VLAN_IP_PREFIX}.131"
      node-red_internal:
        aliases:
          - "${NODE_RED_DOMAIN}"
    mac_address: "${NODE_RED_MAC_ADDRESS}"
    # expose:
    #   - "${NODE_RED_PORT}"
    dns: "${DNS_IP}"
    <<: *hardened-security
    cap_add:
      - NET_BIND_SERVICE
      # to communicate with all the IOT devices
      - NET_RAW
    security_opt:
      # important: override the "hardened-security" anchor. node-red doesn't work with "no-new-privileges:true", so we cannot set this one for now
      - no-new-privileges:false
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=10m,mode=660,uid=${NODE_RED_USER},gid=${DOCKER_USER_GROUP}"
    volumes:
      - "${VOLUME_BASE_DIRECTORY}/node-red/data:/data:rw"
      - "${VOLUME_BASE_DIRECTORY}/node-red/cert:/cert:ro"
    user: "${NODE_RED_USER}:${DOCKER_USER_GROUP}"
    environment:
      TZ: "${TIMEZONE}"
      PORT: "443"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -qO- --no-check-certificate https://127.0.0.1:443/ || wget --no-verbose --tries=1 -qO- --no-check-certificate http://127.0.0.1:443/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  node-red-ts:
    container_name: node-red-ts
    <<: *tailscale-sidecar
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_NODE_RED}
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:type-docker,tag:hosting-onpremise,tag:svc-node-red
      TS_HOSTNAME: node-red
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"

    volumes:
      - ${VOLUME_BASE_DIRECTORY}/tailscale/node-red:/var/lib/tailscale:rw

    networks:
      - node-red_internal
      - ts_egress

  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    user: "${POSTGRES_USER_ID}:${DOCKER_USER_GROUP}"
    <<: *hardened-security
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=770,uid=${POSTGRES_USER_ID},gid=${DOCKER_USER_GROUP}"
      - "/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=770,uid=${POSTGRES_USER_ID},gid=${DOCKER_USER_GROUP}"
    volumes:
      - ${VOLUME_BASE_DIRECTORY}/postgres/data:/var/lib/postgresql/data:rw
      - ${VOLUME_BASE_DIRECTORY}/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB_OPENWEBUI}"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: "${TIMEZONE}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_OPENWEBUI}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres_internal
    restart: always

  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm-non_root:main-v1.48.9@sha256:b33c98b63c7b67ac085a25351963229899452fc94bf5b95a7a6cafaa7d4a057a
    user: "${LITELLM_USER}:${DOCKER_USER_GROUP}"
    <<: *hardened-security
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=770,uid=${LITELLM_USER},gid=${DOCKER_USER_GROUP}"
      - "/.cache:rw,nosuid,nodev,size=1g,mode=770,uid=${LITELLM_USER},gid=${DOCKER_USER_GROUP}"
    volumes:
      - ${VOLUME_BASE_DIRECTORY}/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_LITELLM}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      TZ: "${TIMEZONE}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -qO- http://127.0.0.1:4000/health/liveliness || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_internal
      - ai_network
    restart: always

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9
    user: "${OPEN_WEBUI_USER}:${DOCKER_USER_GROUP}"
    <<: *hardened-security
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=128m,mode=770,uid=${OPEN_WEBUI_USER},gid=${DOCKER_USER_GROUP}"
    volumes:
      - ${VOLUME_BASE_DIRECTORY}/open-webui/data:/app/backend/data:rw
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_OPENWEBUI}"
      OPENAI_API_BASE_URL: "http://litellm:4000/v1"
      OPENAI_API_KEY: "${LITELLM_MASTER_KEY}"
      WEBUI_SECRET_KEY: "${OPEN_WEBUI_SECRET_KEY}"
      PORT: "8080"
      TZ: "${TIMEZONE}"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      dockervlan:
        ipv4_address: "${DOCKER_VLAN_IP_PREFIX}.135"
      open-webui_internal:
        aliases:
          - "${OPEN_WEBUI_DOMAIN}"
      postgres_internal:
      ai_network:
    mac_address: "${OPEN_WEBUI_MAC_ADDRESS}"
    dns: "${DNS_IP}"
    restart: always

  open-webui-ts:
    container_name: open-webui-ts
    <<: *tailscale-sidecar
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_OPEN_WEBUI}
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:type-docker,tag:hosting-onpremise,tag:svc-open-webui
      TS_HOSTNAME: open-webui
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"

    volumes:
      - ${VOLUME_BASE_DIRECTORY}/tailscale/open-webui:/var/lib/tailscale:rw

    networks:
      - open-webui_internal
      - ts_egress

