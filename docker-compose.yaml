networks:
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: ovs_bond0
    ipam:
      config:
        - subnet: "${DOCKER_VLAN_IP_PREFIX}.0/24"
          ip_range: "${DOCKER_VLAN_IP_PREFIX}.128/25"
          gateway: "${DNS_IP}"
  adguard-home_internal:
    driver: bridge
    internal: true
  # uptime-kuma_internal:
  #   driver: bridge
  #   internal: true
  beszel-hub_internal:
    driver: bridge
    internal: true
  node-red_internal:
    driver: bridge
    internal: true
  open-webui_internal:
    driver: bridge
    internal: true
  postgres_internal:
    driver: bridge
    internal: true
  ai_network:
    driver: bridge
  ts_egress:
    driver: bridge
