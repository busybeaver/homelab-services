  beszel-hub:
    container_name: beszel-hub
    image: henrygd/beszel:v0.20.0@sha256:897e807a065adf8e89e30ae0cd79d1f5e38fe84ccaffbc418bde9d3cdca4eacc
    networks:
      dockervlan:
        ipv4_address: "${DOCKER_VLAN_IP_PREFIX:?DOCKER_VLAN_IP_PREFIX is required}.134"
      beszel-hub_internal:
        aliases:
          - "${BESZEL_DOMAIN:?BESZEL_DOMAIN is required}"
    mac_address: "${BESZEL_MAC_ADDRESS:?BESZEL_MAC_ADDRESS is required}"
    dns: "${DNS_IP:?DNS_IP is required}"
    user: "${BESZEL_USER:?BESZEL_USER is required}:${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    <<: *hardened-security
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=770,uid=${BESZEL_USER:?BESZEL_USER is required},gid=${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    volumes:
      - "${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/beszel/data:/beszel_data:rw"
      - "${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/beszel/socket:/beszel_socket:rw"
    environment:
      APP_URL: "http://${DOCKER_VLAN_IP_PREFIX:?DOCKER_VLAN_IP_PREFIX is required}.134:8090"
      CHECK_UPDATES: "false"

      # Do NOT set AUTO_LOGIN.
      # Do NOT set TRUSTED_AUTH_HEADER unless you deliberately deploy
      # a trusted SSO/auth proxy and also configure TRUSTED_PROXY_IPS.
      # Do NOT set SHARE_ALL_SYSTEMS in a multi-user setup.

      # Optional external dead-man's-switch check:
      # HEARTBEAT_URL: "https://hc-ping.example.net/<unique-secret-url>"
      # HEARTBEAT_METHOD: "POST"
      # HEARTBEAT_INTERVAL: "60"
    pids_limit: 150
    mem_limit: 384m
    # not supported by Synology NAS:
    # cpus: 1.0
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3

  beszel-hub-ts:
    container_name: beszel-hub-ts
    <<: *tailscale-sidecar
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_BESZEL:?TS_AUTHKEY_BESZEL is required}
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:type-docker,tag:hosting-onpremise,tag:svc-beszel
      TS_HOSTNAME: beszel
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"

    volumes:
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/tailscale/beszel:/var/lib/tailscale:rw

    networks:
      - beszel-hub_internal
      - ts_egress

  node-red:
    container_name: node-red
    image: ghcr.io/busybeaver/homelab-packages/node-red:latest@sha256:59308e589dbac32b61dce43d0c9a2167c05361c31e6e1e6d21acd4679ea781ef
    networks:
      dockervlan:
        ipv4_address: "${DOCKER_VLAN_IP_PREFIX:?DOCKER_VLAN_IP_PREFIX is required}.131"
      node-red_internal:
        aliases:
          - "${NODE_RED_DOMAIN:?NODE_RED_DOMAIN is required}"
    mac_address: "${NODE_RED_MAC_ADDRESS:?NODE_RED_MAC_ADDRESS is required}"
    # expose:
    #   - "${NODE_RED_PORT}"
    dns: "${DNS_IP:?DNS_IP is required}"
    <<: *hardened-security
    cap_add:
      - NET_BIND_SERVICE
      # to communicate with all the IOT devices
      - NET_RAW
    security_opt:
      # important: override the "hardened-security" anchor. node-red doesn't work with "no-new-privileges:true", so we cannot set this one for now
      - no-new-privileges:false
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=10m,mode=770,uid=${NODE_RED_USER:?NODE_RED_USER is required},gid=${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    volumes:
      - "${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/node-red/data:/data:rw"
      - "${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/node-red/cert:/cert:ro"
    user: "${NODE_RED_USER:?NODE_RED_USER is required}:${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    environment:
      TZ: "${TIMEZONE:?TIMEZONE is required}"
      PORT: "443"
    # no healthcheck here on purpose: the image already defines "HEALTHCHECK node /healthcheck.js" which reads uiPort/https from /data/settings.js (so those must be set there)
    pids_limit: 300
    mem_limit: 768m

  node-red-ts:
    container_name: node-red-ts
    <<: *tailscale-sidecar
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_NODE_RED:?TS_AUTHKEY_NODE_RED is required}
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:type-docker,tag:hosting-onpremise,tag:svc-node-red
      TS_HOSTNAME: node-red
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"

    volumes:
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/tailscale/node-red:/var/lib/tailscale:rw

    networks:
      - node-red_internal
      - ts_egress

  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    user: "${POSTGRES_USER_ID:?POSTGRES_USER_ID is required}:${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    <<: *hardened-security
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=770,uid=${POSTGRES_USER_ID:?POSTGRES_USER_ID is required},gid=${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
      - "/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=770,uid=${POSTGRES_USER_ID:?POSTGRES_USER_ID is required},gid=${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    volumes:
      # the pg18 image declares /var/lib/postgresql as its VOLUME, so mount that path (otherwise docker creates an orphaned anonymous volume). PGDATA below maps to the same host directory (.../postgres/data/pgdata) as before, so existing data stays in place
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/postgres/data:/var/lib/postgresql:rw
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB_OPENWEBUI:?POSTGRES_DB_OPENWEBUI is required}"
      PGDATA: /var/lib/postgresql/pgdata
      TZ: "${TIMEZONE:?TIMEZONE is required}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB_OPENWEBUI:?POSTGRES_DB_OPENWEBUI is required}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # give postgres time to shut down cleanly (checkpoint) before docker sends SIGKILL
    stop_grace_period: 1m
    pids_limit: 200
    mem_limit: 1g
    networks:
      - postgres_internal

  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm-non_root:v1.103.2@sha256:bee25ffdd3952562401cd1cb844f2b925f006ea8102d719b6d311cc844594d6c
    user: "${LITELLM_USER:?LITELLM_USER is required}:${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    <<: *hardened-security
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=770,uid=${LITELLM_USER:?LITELLM_USER is required},gid=${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
      - "/app/.cache:rw,nosuid,nodev,size=64m,mode=770,uid=${LITELLM_USER:?LITELLM_USER is required},gid=${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    volumes:
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB_LITELLM:?POSTGRES_DB_LITELLM is required}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}"
      # encrypts provider credentials stored in the db. set once and NEVER change it afterwards (stored credentials become unreadable)
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY (once, never change it)}"
      PRISMA_GENERATE_SKIP: "true"
      TZ: "${TIMEZONE:?TIMEZONE is required}"
    # the image doesn't define a HEALTHCHECK. "liveliness" (sic) is litellm's actual endpoint name; urlopen raises on non-2xx, so the exit code reflects the result
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # first start runs the prisma database migrations, which can take a while
      start_period: 90s
    pids_limit: 300
    # tmpfs mounts (see above) count towards this limit
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_internal
      - ai_network

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    user: "${OPEN_WEBUI_USER:?OPEN_WEBUI_USER is required}:${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    <<: *hardened-security
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=128m,mode=770,uid=${OPEN_WEBUI_USER:?OPEN_WEBUI_USER is required},gid=${DOCKER_USER_GROUP:?DOCKER_USER_GROUP is required}"
    volumes:
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/open-webui/data:/app/backend/data:rw
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB_OPENWEBUI:?POSTGRES_DB_OPENWEBUI is required}"
      OPENAI_API_BASE_URL: "http://litellm:4000/v1"
      # a scoped litellm virtual key (created in the litellm admin UI/API), not the master key
      OPENAI_API_KEY: "${OPEN_WEBUI_LITELLM_API_KEY:?set OPEN_WEBUI_LITELLM_API_KEY to a litellm virtual key}"
      # use the pgvector extension of the postgres container for RAG embeddings (PGVECTOR_DB_URL defaults to DATABASE_URL) instead of the default chroma in the data volume
      VECTOR_DB: "pgvector"
      # no ollama in this stack; without this open-webui keeps probing localhost:11434. (persisted in the db after first start, so later changes are made in the admin UI)
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: "${OPEN_WEBUI_SECRET_KEY:?OPEN_WEBUI_SECRET_KEY is required}"
      PORT: "8080"
      TZ: "${TIMEZONE:?TIMEZONE is required}"
    # no healthcheck here on purpose: the image already defines one (curl /health)
    pids_limit: 300
    # the default local embedding model for RAG needs quite some memory
    mem_limit: 4g
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      dockervlan:
        ipv4_address: "${DOCKER_VLAN_IP_PREFIX:?DOCKER_VLAN_IP_PREFIX is required}.135"
      open-webui_internal:
        aliases:
          - "${OPEN_WEBUI_DOMAIN:?OPEN_WEBUI_DOMAIN is required}"
      postgres_internal:
      ai_network:
    mac_address: "${OPEN_WEBUI_MAC_ADDRESS:?OPEN_WEBUI_MAC_ADDRESS is required}"
    dns: "${DNS_IP:?DNS_IP is required}"

  open-webui-ts:
    container_name: open-webui-ts
    <<: *tailscale-sidecar
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_OPEN_WEBUI:?TS_AUTHKEY_OPEN_WEBUI is required}
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:type-docker,tag:hosting-onpremise,tag:svc-open-webui
      TS_HOSTNAME: open-webui
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"

    volumes:
      - ${VOLUME_BASE_DIRECTORY:?VOLUME_BASE_DIRECTORY is required}/tailscale/open-webui:/var/lib/tailscale:rw

    networks:
      - open-webui_internal
      - ts_egress

  # n8n:
  # container_name: n8n
