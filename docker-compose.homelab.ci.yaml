services:
  adguard-home:
    networks:
      dockervlan:
        ipv4_address: 10.200.0.130
    mac_address: ""

  # uptime-kuma:
  #   environment:
  #     UPTIME_KUMA_HOST: 10.200.0.132
  #     NODE_TLS_REJECT_UNAUTHORIZED: "0"
  #   networks:
  #     dockervlan:
  #       ipv4_address: 10.200.0.132
  #   mac_address: ""

  beszel-hub:
    networks:
      dockervlan:
        ipv4_address: 10.200.0.134
    mac_address: ""

  node-red:
    networks:
      dockervlan:
        ipv4_address: 10.200.0.131
    mac_address: ""

  open-webui:
    networks:
      dockervlan:
        ipv4_address: 10.200.0.135
    mac_address: ""

  adguard-home-ts:
    entrypoint: ["tailscaled", "--tun=userspace-networking"]
    devices: []

  # uptime-kuma-ts:
  #   entrypoint: ["tailscaled", "--tun=userspace-networking"]
  #   devices: []

  beszel-hub-ts:
    entrypoint: ["tailscaled", "--tun=userspace-networking"]
    devices: []

  node-red-ts:
    entrypoint: ["tailscaled", "--tun=userspace-networking"]
    devices: []

  open-webui-ts:
    entrypoint: ["tailscaled", "--tun=userspace-networking"]
    devices: []

  test:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    pids_limit: 50
    mem_limit: 64m
    networks:
      dockervlan:
        ipv4_address: 10.200.0.133
      # to reach litellm, which isn't attached to the dockervlan network
      ai_network:
    depends_on:
      adguard-home:
        condition: service_healthy
      beszel-hub:
        condition: service_healthy
      node-red:
        condition: service_healthy
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      open-webui:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -u
        failed=0
        # runs every check (instead of aborting on the first failure) so a single CI run reports all broken services
        test_service() {
          name=$$1
          url=$$2
          pattern=$$3
          echo "Testing $${name} at $${url}..."
          if ! response=$$(curl -sS -f -L -k --connect-timeout 5 --max-time 15 --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors "$${url}"); then
            echo "$${name} test failed: could not reach $${url}"
            failed=1
            return 0
          fi
          if printf '%s' "$${response}" | grep -i -q -- "$${pattern}"; then
            echo "$${name} test passed!"
          else
            echo "$${name} test failed: response did not match pattern '$${pattern}'"
            printf "Response body preview:\n%.500s\n" "$${response}"
            failed=1
          fi
        }
        test_service "adguard-home" "https://adguard-home:443/" "apple-touch-icon"
        test_service "beszel-hub" "http://beszel-hub:8090/" "beszel"
        test_service "node-red" "https://node-red:443/" "Node-RED"
        test_service "open-webui" "http://open-webui:8080/" "webui"
        test_service "open-webui health" "http://open-webui:8080/health" "true"
        test_service "litellm" "http://litellm:4000/health/liveliness" "alive"
        if [ "$${failed}" -ne 0 ]; then
          echo "Some tests failed!"
          exit 1
        fi
        echo "All tests passed!"

networks:
  dockervlan:
    driver: bridge
    driver_opts:
      parent: ""
    ipam:
      config:
        - subnet: 10.200.0.0/24
