# development tooling and tasks for this repository; run `mise run setup` once, then `mise tasks` to list all tasks

[tools]
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:cocogitto/cocogitto" = "7.0.0"
"aqua:oxc-project/oxc/oxfmt" = "0.75.0"
"aqua:nektos/act" = "0.2.92"
"aqua:cli/cli" = "2.103.3" # gh: pull requests, workflow runs and releases
# linters; they use the same configs as the CI (.github/linters/)
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0" # also used by actionlint for `run:` scripts
"aqua:mvdan/sh" = "3.14.1" # shfmt
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"
"pipx:yamllint" = "1.38.0"
"aqua:astral-sh/uv" = "0.13.6" # installs pipx tools
# used by the release-policy checker (.github/scripts/); preinstalled on the GitHub runners
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.54.1"

[settings]
# install pipx tools with uv, so no python/pipx setup is required
pipx.uvx = true

[tasks.setup]
description = "Install the tooling and the git hooks"
alias = "init"
run = ["mise install", "lefthook install"]

[tasks.format]
description = "Format files; formats all tracked files if no files are given"
alias = "fmt"
usage = 'arg "[files]..." help="Files to format"'
run = 'oxfmt --no-error-on-unmatched-pattern ${usage_files:-$(git ls-files)}'

[tasks.check]
description = "Run all checks"
depends = ["check:*"]

[tasks."check:format"]
description = "Check that all tracked files are formatted"
run = 'oxfmt --check --no-error-on-unmatched-pattern $(git ls-files)'

[tasks."check:compose"]
description = "Validate the compose files with the CI environment"
run = "docker compose --env-file .env.ci -f docker-compose.homelab.yaml -f docker-compose.homelab.ci.yaml config --quiet"

[tasks."check:release"]
description = "Test the release scripts and check every release target (docker-compose.<target>.yaml) against the release policy"
run = [
  "bash .github/scripts/test-check-compose-release.sh",
  "bash .github/scripts/test-release-scripts.sh",
  'bash .github/scripts/release-targets.sh | while read -r file; do bash .github/scripts/check-compose-release.sh "$file" .env.ci || exit 1; done',
]

[tasks."check:shell"]
description = "Lint and check the formatting of all tracked shell scripts"
run = ['shellcheck $(git ls-files "*.sh")', 'shfmt --diff $(git ls-files "*.sh")']

[tasks."check:actions"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks."check:yaml"]
description = "Lint all tracked YAML files"
run = 'yamllint --config-file .github/linters/.yaml-lint.yml $(git ls-files "*.yaml" "*.yml")'

[tasks."check:secrets"]
description = "Scan the git history for leaked secrets"
run = "gitleaks git --config .github/linters/.gitleaks.toml --redact --no-banner"

[tasks."check:editorconfig"]
description = "Check all tracked files against .editorconfig"
run = "editorconfig-checker -config .github/linters/.ecrc $(git ls-files ':!:.git-crypt/')"

[tasks.commit]
description = "Create a conventional commit, e.g. `mise run commit feat \"add service\" compose`"
alias = "cm"
run = "cog commit"

[tasks.ci]
description = "Run the CI workflows locally (defaults to the push event); extra args are passed to act"
run = "act"

[tasks."compose:up"]
description = "Start the stack; extra args are passed to `docker compose up`"
run = "docker compose -f docker-compose.homelab.yaml up"

[tasks."compose:down"]
description = "Stop the stack; extra args are passed to `docker compose down`"
run = "docker compose -f docker-compose.homelab.yaml down"
